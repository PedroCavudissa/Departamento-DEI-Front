<div class="p-4">
    <h2 class="text-lg font-semibold mb-4">Registros de Atividades</h2>
  
    <div *ngIf="carregando">Carregando...</div>
  
    <ul *ngIf="!carregando && logs.length">
      <li *ngFor="let log of logs" class="mb-2 border-b pb-2">
        <strong>{{ log.criadoPor }}</strong> {{ log.acao.toLowerCase() }} 
        <span class="text-sm italic text-gray-500">
          ({{ log.entidade }} #{{ log.entidadeId }}) em {{ log.data | date:'short' }}
        </span>
      </li>
    </ul>
  
    <div *ngIf="!carregando && !logs.length">Nenhum log encontrado.</div>
  </div>

  <app-barralateral></app-barralateral>
