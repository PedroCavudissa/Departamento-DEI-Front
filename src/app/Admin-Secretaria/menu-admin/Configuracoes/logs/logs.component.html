<div class="container">
  <h2>Logs de Ações</h2>
  <table>
    <thead>
      <tr>
        <th>Ação</th>
        <th>Entidade</th>
        <th>Criado por</th>
        <th>Data</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let log of logs">
        <td>{{ log.acao }}</td>
        <td>{{ log.entidade }}</td>
        <td>{{ log.criadoPor }}</td>
        <td>{{ log.data | date:'short' }}</td>
      </tr>
    </tbody>
  </table>
  
</div>

  <app-barralateral></app-barralateral>
