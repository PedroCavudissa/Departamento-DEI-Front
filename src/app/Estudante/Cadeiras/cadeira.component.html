<div class="conteudo">
  <main class="painel">
    <div class="container-principal">
      <div class="caixa-branca">
        <h3 class="titulo">Disciplinas em Atraso</h3>

        <!-- Quando houver disciplinas -->
        <div class="tabela" *ngIf="carregouComSucesso && disciplinas.length > 0">
          <table>
            <thead>
              <tr>
                <th>Cadeira</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let disciplina of disciplinas">
                <td>{{ disciplina.nome }}</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Quando a requisição foi bem-sucedida mas veio vazia -->
        <p *ngIf="carregouComSucesso && disciplinas.length === 0" class="mensagem-vazia">
  {{ mensagem || 'Sem disciplinas em atraso.' }}
</p>


        <!-- Quando falhou ao carregar -->
        <p *ngIf="!carregouComSucesso" class="mensagem-erro">
          Verifique sua conexão com a internet ou tente novamente mais tarde.
        </p>
      </div>
    </div>
  </main>
</div>

<app-lateral></app-lateral>
