<div class="container">
    <h2>Alteração de Senha</h2>
  
    <form [formGroup]="form" (ngSubmit)="alterarSenha()">
      <fieldset>
        <legend>Altere a senha para prosseguir</legend>
  
        <div>
          <label for="senhaAtual">Senha Atual</label>
          <input type="password" id="senhaAtual" formControlName="senhaAtual">
  
          <label for="novaSenha">Nova Senha</label>
          <input type="password" id="novaSenha" formControlName="novaSenha">
  
          <label for="confirmarSenha">Confirmar Senha</label>
          <input type="password" id="confirmarSenha" formControlName="confirmarSenha">
  
          <div *ngIf="form.errors?.['mismatch'] && form.get('confirmarSenha')?.touched" style="color: red;">
            As senhas não coincidem!
          </div>
          
       
          
        </div>
  
        <button type="submit" [disabled]="form.invalid">Avançar</button>
      </fieldset>
    </form>
  </div>
